[project]
name = "sensor-sim-api"
version = "0.1.0"
description = "REST API web services for interacting with sensor data generator library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "pydantic>=2.11.1",
 "pydantic-settings>=2.0.0",
 "fastapi[standard-no-fastapi-cloud-cli]>=0.124.0",
 "alembic>=1.17.2",
 "sqlalchemy>=2.0.45",
 "psycopg[binary,pool]>=3.3.2",
 "generators",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.0",
    "debugpy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
respect-gitignore = true
ignore-init-module-imports = true

# Don't remove imports with noqa comments
ignore = []

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]  # Allow unused imports in Alembic

[tool.uv.sources]
generators = { workspace = true }
